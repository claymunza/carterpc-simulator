<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        /* --- Base Styles --- */
        body {
            margin: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Desktop Layout Container --- */
        .shorts-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        /* --- Left Side: Video Details --- */
        .metadata-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
            z-index: 10;
        }

        .creator-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e0e0e0;
            object-fit: cover;
        }

        .handle {
            font-size: 15px;
            font-weight: 500;
            color: #0f0f0f;
        }

        .subscribe-btn {
            background-color: #0f0f0f;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .subscribe-btn:hover {
            opacity: 0.8;
        }

        .video-title {
            font-size: 16px;
            font-weight: 400;
            color: #0f0f0f;
            margin: 0;
            line-height: 1.4;
            max-width: 400px;
        }

        /* --- Right Side: Video & Actions --- */
        .player-section {
            display: flex;
            align-items: flex-end;
            gap: 16px;
        }

        /* Video Frame (Container for visual elements) */
        .video-frame {
            width: 330px;
            aspect-ratio: 9 / 16;
            background-color: #1a1a1a;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }

        /* Top Overlay Controls */
        .top-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .control-group {
            display: flex;
            gap: 12px;
        }

        .overlay-btn {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Caption Overlay */
        .caption-overlay {
            position: absolute;
            top: 40%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 5;
        }

        .caption-highlight {
            color: #ffd700;
        }

        /* Action Buttons Bar */
        .action-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-bottom: 10px;
            z-index: 10;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            color: #0f0f0f;
            padding: 0;
        }

        .icon-circle {
            background-color: #f2f2f2;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .icon-circle:hover {
            background-color: #e5e5e5;
        }

        .icon-circle .material-icons {
            font-size: 24px;
        }

        .action-item span {
            font-size: 13px;
            font-weight: 500;
        }

        .audio-track {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-color: #e0e0e0;
            object-fit: cover;
            margin-top: 8px;
        }

        /* --- Mobile Responsive UI --- */
        @media (max-width: 800px) {
            body {
                background-color: #000000;
            }

            .shorts-container {
                height: 100dvh;
                padding: 0;
                justify-content: center;
                align-items: center;
            }

            .player-section {
                width: 100%;
                height: 100%;
                gap: 0;
            }

            .video-frame {
                width: 100%;
                height: 100%;
                border-radius: 0;
            }

            /* Convert Metadata to Bottom-Left Overlay */
            .metadata-section {
                position: absolute;
                bottom: 24px;
                left: 16px;
                width: calc(100% - 80px);
            }

            .handle, .video-title {
                color: #ffffff;
                text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            }

            .subscribe-btn {
                background-color: #ffffff;
                color: #0f0f0f;
            }

            /* Convert Actions to Bottom-Right Overlay */
            .action-bar {
                position: absolute;
                bottom: 24px;
                right: 12px;
            }

            .action-item {
                color: #ffffff;
            }

            .icon-circle {
                background-color: rgba(255, 255, 255, 0.1);
                color: #ffffff;
                backdrop-filter: blur(4px);
            }

            .icon-circle:hover {
                background-color: rgba(255, 255, 255, 0.2);
            }
        }
    </style>
</head>
<body>

    <div class="shorts-container">
        
        <div class="metadata-section">
            <div class="creator-info">
                <img src="https://ui-avatars.com/api/?name=C&background=random" alt="Avatar" class="avatar">
                <span class="handle">@actuallycarterpcs</span>
                <button class="subscribe-btn" onclick="toggleSubscribe(this)">Subscribe</button>
            </div>
            <h1 class="video-title">I would switch to Linux.. #carterpcs #tec...</h1>
        </div>

        <div class="player-section">
            
            <div class="video-frame">
                <img src="https://images.unsplash.com/photo-1621501103258-3e121eb83c16?q=80&w=600&auto=format&fit=crop" style="width:100%; height:100%; object-fit:cover; opacity:0.6; position:absolute;" alt="Video Background">

                <div class="top-controls">
                    <div class="control-group">
                        <button class="overlay-btn"><i class="material-icons">play_arrow</i></button>
                        <button class="overlay-btn"><i class="material-icons">volume_up</i></button>
                    </div>
                    <div class="control-group">
                        <button class="overlay-btn"><i class="material-icons">more_vert</i></button>
                        <button class="overlay-btn"><i class="material-icons">fullscreen</i></button>
                    </div>
                </div>

                <div class="caption-overlay">
                    IT CAUSE <span class="caption-highlight">IT'S</span>
                </div>
            </div>

            <div class="action-bar">
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">thumb_up</i></div>
                    <span>20k</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">thumb_down</i></div>
                    <span>Dislike</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">comment</i></div>
                    <span>1,160</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">reply</i></div>
                    <span>Share</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">sync</i></div>
                    <span>Remix</span>
                </button>
                <img src="https://ui-avatars.com/api/?name=Track&background=0D8ABC&color=fff" class="audio-track" alt="Audio">
            </div>

        </div>
    </div>

    <script>
        function toggleSubscribe(btn) {
            if (btn.innerText === "Subscribe") {
                btn.innerText = "Subscribed";
                btn.style.backgroundColor = window.innerWidth <= 800 ? "rgba(255,255,255,0.2)" : "#f2f2f2";
                btn.style.color = window.innerWidth <= 800 ? "#fff" : "#0f0f0f";
            } else {
                btn.innerText = "Subscribe";
                btn.style.backgroundColor = window.innerWidth <= 800 ? "#ffffff" : "#0f0f0f";
                btn.style.color = window.innerWidth <= 800 ? "#0f0f0f" : "#ffffff";
            }
        }
    </script>
</body>
</html>
