<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        /* --- Base Styles --- */
        body {
            margin: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Desktop Layout Container --- */
        .shorts-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        /* --- Left Side: Video Details --- */
        .metadata-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
            z-index: 10;
        }

        .creator-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e0e0e0;
            object-fit: cover;
        }

        .handle {
            font-size: 15px;
            font-weight: 500;
            color: #0f0f0f;
        }

        .subscribe-btn {
            background-color: #0f0f0f;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .subscribe-btn:hover {
            opacity: 0.8;
        }

        .video-title {
            font-size: 16px;
            font-weight: 400;
            color: #0f0f0f;
            margin: 0;
            line-height: 1.4;
            max-width: 400px;
        }

        /* --- Right Side: Video & Actions --- */
        .player-section {
            display: flex;
            align-items: flex-end;
            gap: 16px;
        }

        /* Video Frame (Container for visual elements) */
        .video-frame {
            width: 330px;
            aspect-ratio: 9 / 16;
            background-color: #1a1a1a;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }

        /* --- Avatar Parallax System --- */
        .avatar-parallax-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Keeps it behind the z-index: 5 controls */
            background-color: #e5e5e5; /* Fallback background for the avatar */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Base settings for all image layers */
        .parallax-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the images maintain proportions and align perfectly */
            transform-origin: center center;
        }

        /* Parallax Keyframes 
           Different layers move at different distances/rotations to create depth.
        */
        
        /* 1. Neck: Barely moves, anchors the base */
        @keyframes idle-neck {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(2px); }
        }

        /* 2. Head & Ears: Moderate movement, slight rotation for breathing/idle feel */
        @keyframes idle-head {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }

        /* 3. Hair: Most movement, creating the foreground 3D illusion */
        @keyframes idle-hair {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg) translateX(3px); }
        }

        /* Applying the layers and animations */
        .layer-neck {
            z-index: 10;
            animation: idle-neck 4s ease-in-out infinite;
        }

        .layer-ears {
            z-index: 11;
            /* Syncs with head movement */
            animation: idle-head 4s ease-in-out infinite; 
        }

        .layer-head {
            z-index: 12;
            animation: idle-head 4s ease-in-out infinite;
        }

        .layer-hair {
            z-index: 13;
            /* Hair moves slightly faster or further for depth */
            animation: idle-hair 4s ease-in-out infinite;
        }

        /* Top Overlay Controls */
        .top-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }

        .control-group {
            display: flex;
            gap: 12px;
        }

        .overlay-btn {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Caption Overlay */
        .caption-overlay {
            position: absolute;
            top: 40%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 5;
        }

        .caption-highlight {
            color: #ffd700;
        }

        /* Action Buttons Bar */
        .action-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-bottom: 10px;
            z-index: 10;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            color: #0f0f0f;
            padding: 0;
        }

        .icon-circle {
            background-color: #f2f2f2;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .icon-circle:hover {
            background-color: #e5e5e5;
        }

        .icon-circle .material-icons {
            font-size: 24px;
        }

        .action-item span {
            font-size: 13px;
            font-weight: 500;
        }

        .audio-track {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-color: #e0e0e0;
            object-fit: cover;
            margin-top: 8px;
        }

        /* --- Simulator Control Panel (Desktop Top-Left) --- */
        .control-panel {
            position: absolute;
            top: 40px;
            left: 40px;
            background: rgba(255, 255, 255, 0.95);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 280px;
            backdrop-filter: blur(10px);
        }

        .control-panel h2 {
            margin: 0;
            font-size: 18px;
            color: #0f0f0f;
        }

        .control-group-ui {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group-ui label {
            font-size: 12px;
            font-weight: 700;
            color: #606060;
            text-transform: uppercase;
        }

        .control-group-ui select, .control-group-ui button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 14px;
        }

        .generate-btn {
            background-color: #0556bf;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .generate-btn:hover {
            background-color: #044396;
        }

        /* --- Intense Animation State --- */
        @keyframes intense-talking {
            0% { transform: translateY(0) rotate(0deg); }
            20% { transform: translateY(-6px) rotate(-4deg); }
            40% { transform: translateY(3px) rotate(5deg); }
            60% { transform: translateY(-4px) rotate(-3deg); }
            80% { transform: translateY(2px) rotate(2deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .is-talking .layer-head, .is-talking .layer-ears {
            animation: intense-talking 0.5s infinite !important;
        }
        
        .is-talking .layer-hair {
            animation: intense-talking 0.5s infinite 0.1s !important; /* Slight delay for physics */
        }

        /* --- Rotate Device Warning --- */
        #rotate-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f0f0f;
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning i {
            font-size: 64px;
            margin-bottom: 20px;
            animation: rotate-phone 2s infinite ease-in-out;
        }

        @keyframes rotate-phone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- Mobile Responsive UI --- */
        @media (max-width: 800px) {
            /* Hide UI and show warning if mobile is in portrait */
            @media (orientation: portrait) {
                .shorts-container { display: none !important; }
                #rotate-warning { display: flex !important; }
            }
            body {
                background-color: #000000;
            }

            .shorts-container {
                height: 100dvh;
                padding: 0;
                justify-content: center;
                align-items: center;
            }

            .player-section {
                width: 100%;
                height: 100%;
                gap: 0;
            }

            .video-frame {
                width: 100%;
                height: 100%;
                border-radius: 0;
            }

            /* Convert Metadata to Bottom-Left Overlay */
            .metadata-section {
                position: absolute;
                bottom: 24px;
                left: 16px;
                width: calc(100% - 80px);
            }

            .handle, .video-title {
                color: #ffffff;
                text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            }

            .subscribe-btn {
                background-color: #ffffff;
                color: #0f0f0f;
            }

            /* Convert Actions to Bottom-Right Overlay */
            .action-bar {
                position: absolute;
                bottom: 24px;
                right: 12px;
            }

            .action-item {
                color: #ffffff;
            }

            .icon-circle {
                background-color: rgba(255, 255, 255, 0.1);
                color: #ffffff;
                backdrop-filter: blur(4px);
            }

            .icon-circle:hover {
                background-color: rgba(255, 255, 255, 0.2);
            }
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <i class="material-icons">screen_rotation</i>
        <h2>Please rotate your device</h2>
        <p>Landscape mode is required for the CarterPCs Simulator experience.</p>
    </div>

    <div class="control-panel">
        <h2>CarterPCs Simulator</h2>
        
        <div class="control-group-ui">
            <label>Topic</label>
            <select id="sim-topic">
                <option value="Linux">Linux</option>
                <option value="Apple">Apple / Macs</option>
                <option value="GPUs">Nvidia GPUs</option>
                <option value="Pre-builts">Pre-built PCs</option>
                <option value="RGB">RGB Lighting</option>
            </select>
        </div>

        <div class="control-group-ui">
            <label>Tone</label>
            <select id="sim-tone">
                <option value="Humorous">Humorous</option>
                <option value="Aggressive">Aggressive Rant</option>
                <option value="Educational">Educational</option>
                <option value="Sarcastic">Sarcastic</option>
            </select>
        </div>

        <div class="control-group-ui">
            <label>Subtopic</label>
            <select id="sim-subtopic">
                <option value="Switching">Switching over</option>
                <option value="Pricing">The Pricing</option>
                <option value="Fanboys">The Fanboys</option>
                <option value="Performance">Gaming Performance</option>
                <option value="Aesthetics">The Aesthetics</option>
            </select>
        </div>

        <div class="control-group-ui">
            <label>Stance</label>
            <select id="sim-stance">
                <option value="For">For / In Favor</option>
                <option value="Against">Against / Hating</option>
            </select>
        </div>

        <button class="generate-btn" onclick="startSimulation()">Generate Short!</button>
    </div>

    <div class="shorts-container">
        
        <div class="metadata-section">
            <div class="creator-info">
                <img src="https://ui-avatars.com/api/?name=C&background=random" alt="Avatar" class="avatar">
                <span class="handle">@actuallycarterpcs</span>
                <button class="subscribe-btn" onclick="toggleSubscribe(this)">Subscribe</button>
            </div>
            <h1 class="video-title" id="dynamic-title">Configure your video...</h1>
        </div>

        <div class="player-section">
            
            <div class="video-frame">
                <div class="avatar-parallax-container">
                    <img src="/neck.webp" class="parallax-layer layer-neck" alt="Neck">
                    <img src="/ears.webp" class="parallax-layer layer-ears" alt="Ears">
                    <img src="/head.webp" class="parallax-layer layer-head" alt="Head">
                    <img src="/hair.webp" class="parallax-layer layer-hair" alt="Hair">
                </div>

                <div class="top-controls">
                    <div class="control-group">
                        <button class="overlay-btn"><i class="material-icons">play_arrow</i></button>
                        <button class="overlay-btn"><i class="material-icons">volume_up</i></button>
                    </div>
                    <div class="control-group">
                        <button class="overlay-btn"><i class="material-icons">more_vert</i></button>
                        <button class="overlay-btn"><i class="material-icons">fullscreen</i></button>
                    </div>
                </div>

                <div class="caption-overlay" id="dynamic-captions"></div>
            </div>

            <div class="action-bar">
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">thumb_up</i></div>
                    <span>20k</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">thumb_down</i></div>
                    <span>Dislike</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">comment</i></div>
                    <span>1,160</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">reply</i></div>
                    <span>Share</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">sync</i></div>
                    <span>Remix</span>
                </button>
                <img src="https://ui-avatars.com/api/?name=Track&background=0D8ABC&color=fff" class="audio-track" alt="Audio">
            </div>

        </div>
    </div>

   <script>
        // Existing Subscribe logic
        function toggleSubscribe(btn) {
            if (btn.innerText === "Subscribe") {
                btn.innerText = "Subscribed";
                btn.style.backgroundColor = window.innerWidth <= 800 ? "rgba(255,255,255,0.2)" : "#f2f2f2";
                btn.style.color = window.innerWidth <= 800 ? "#fff" : "#0f0f0f";
            } else {
                btn.innerText = "Subscribe";
                btn.style.backgroundColor = window.innerWidth <= 800 ? "#ffffff" : "#0f0f0f";
                btn.style.color = window.innerWidth <= 800 ? "#0f0f0f" : "#ffffff";
            }
        }

        // --- Simulator Engine ---
        let subtitleInterval = null;

        function startSimulation() {
            // 1. Get values from UI
            const topic = document.getElementById('sim-topic').value;
            const tone = document.getElementById('sim-tone').value;
            const subtopic = document.getElementById('sim-subtopic').value;
            const stance = document.getElementById('sim-stance').value;

            // 2. Generate Content Structurally
            const { title, subtitles } = generateScript(topic, tone, subtopic, stance);

            // 3. Update Title UI
            document.getElementById('dynamic-title').innerText = title + " #carterpcs #tech";

            // 4. Start Video Playback Simulation
            playVideo(subtitles);
        }

        function generateScript(topic, tone, subtopic, stance) {
            // Dynamic Title Generation
            let title = `Why I ${stance === 'For' ? 'love' : 'refuse to buy'} ${topic}`;
            if (tone === 'Aggressive') title = title.toUpperCase() + " 😡";
            if (tone === 'Educational') title = `The truth about ${topic} ${subtopic}`;
            if (tone === 'Sarcastic') title = `Oh look, another video about ${topic}...`;

            // Dynamic Subtitle Generation (Array of chunks to display sequentially)
            let subs = [];
            
            // Intro
            subs.push(`Alright let's talk about <span class="caption-highlight">${topic}</span>.`);
            
            // Middle
            if (stance === 'For') {
                subs.push(`Everyone hates on <span class="caption-highlight">${subtopic}</span>...`);
                subs.push(`But honestly? It's <span class="caption-highlight">genius</span>.`);
            } else {
                subs.push(`When it comes to <span class="caption-highlight">${subtopic}</span>...`);
                subs.push(`It is an absolute <span class="caption-highlight">scam</span>.`);
            }

            // Tone Modifiers
            if (tone === 'Humorous') {
                subs.push(`I'd rather use a <span class="caption-highlight">potato</span>.`);
                subs.push(`Bro, be so for real right now.`);
            } else if (tone === 'Aggressive') {
                subs.push(`WHAT ARE THEY <span class="caption-highlight">THINKING?!</span>`);
                subs.push(`Make it make sense!`);
            } else if (tone === 'Educational') {
                subs.push(`Let's look at the <span class="caption-highlight">benchmarks</span>.`);
                subs.push(`The data doesn't lie.`);
            } else if (tone === 'Sarcastic') {
                subs.push(`Wow, very <span class="caption-highlight">innovative</span>.`);
                subs.push(`Take all my money. Not.`);
            }

            // Outro
            subs.push(`Let me know what you think.`);
            subs.push(`Follow for more.`);
            subs.push(``); // Clear screen at end

            return { title, subtitles: subs };
        }

        function playVideo(subtitles) {
            const captionBox = document.getElementById('dynamic-captions');
            const parallaxContainer = document.querySelector('.avatar-parallax-container');
            
            // Clear any currently running video
            if (subtitleInterval) clearInterval(subtitleInterval);
            captionBox.innerHTML = "";
            
            // Start intense talking animation
            parallaxContainer.classList.add('is-talking');

            let index = 0;
            // Change subtitle every 2 seconds
            subtitleInterval = setInterval(() => {
                if (index < subtitles.length) {
                    captionBox.innerHTML = subtitles[index];
                    index++;
                } else {
                    // Video finished
                    clearInterval(subtitleInterval);
                    parallaxContainer.classList.remove('is-talking');
                }
            }, 2000); 
        }
    </script>
</body>
</html>
