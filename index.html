<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>CarterPCs Simulator - Interactive Tech Short Generator</title>
    <meta name="description" content="Configure and generate hilarious, educational, or sarcastic custom tech shorts inspired by CarterPCs inside this interactive Neubrutalist web simulator.">
    <meta name="keywords" content="CarterPCs, Tech Shorts, PC Simulator, Tech Creator Simulator, Neubrutalism, claymunza">
    <meta name="author" content="claymunza">
    <meta name="robots" content="index, follow">

    <meta property="og:type" content="website">
    <meta property="og:title" content="CarterPCs Simulator">
    <meta property="og:description" content="Generate custom interactive tech shorts with an energetic, game-like Neubrutalist experience.">
    <meta property="og:url" content="https://cza.vercel.app"> 
    <meta property="og:site_name" content="CarterPCs Simulator">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="CarterPCs Simulator">
    <meta name="twitter:description" content="An interactive game-like simulator to generate custom tech short-form videos.">
    <meta name="twitter:creator" content="@claymunza">

    <link rel="icon" type="image/jpeg" href="/carter.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="/carter.jpg">
    <link rel="apple-touch-icon" href="/carter.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
       /* --- Base & Dynamic Background Styles --- */
        @keyframes rgb-cycle {
            0% { background-color: #fff0f0; }
            20% { background-color: #f0fff0; }
            40% { background-color: #f0ffff; }
            60% { background-color: #f0f0ff; }
            80% { background-color: #fff0ff; }
            100% { background-color: #fff0f0; }
        }

        body {
            margin: 0;
            font-family: 'Roboto', Arial, sans-serif;
            animation: rgb-cycle 12s linear infinite; /* Seamless soft rainbow background loop */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Cartoon Game Aesthetic Foundations (Neubrutalism) --- */
        .control-panel, .video-frame, .claymunza-footer, .captcha-card {
            border: 4px solid #000000 !important;
            box-shadow: 8px 8px 0px #000000 !important;
        }

        /* --- Desktop Layout Container --- */
        .shorts-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        /* --- Left Side: Video Details --- */
        .metadata-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
            z-index: 10;
        }

        .creator-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e0e0e0;
            object-fit: cover;
            border: 2px solid #000;
        }

        .handle {
            font-size: 15px;
            font-weight: 700;
            color: #0f0f0f;
        }

        /* --- Bouncy & Shiny Neubrutalist Buttons --- */
        .subscribe-btn, .generate-btn, .control-group-ui select {
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s;
        }

        .generate-btn {
            background-color: #ffd700; /* Bright gold for main action */
            margin-top: 10px;
        }

        /* Hover & Active Bouncy Physics */
        .subscribe-btn:hover, .generate-btn:hover, .control-group-ui select:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        .subscribe-btn:active, .generate-btn:active, .control-group-ui select:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        /* Inner Shiny Beveled Edge Overlay */
        .subscribe-btn::before, .generate-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-25deg);
        }

        .subscribe-btn:hover::before, .generate-btn:hover::before {
            left: 150%;
            transition: left 0.6s ease-in-out;
        }

        /* Showering Squares Particle System inside Surface */
        @keyframes showering-squares {
            0% { background-position: 0 0, 10px 20px; }
            100% { background-position: 0 -40px, 10px -20px; }
        }

        .subscribe-btn:hover, .generate-btn:hover {
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,0.3) 3px, transparent 3px),
                linear-gradient(0deg, rgba(255,255,255,0.3) 3px, transparent 3px);
            background-size: 20px 40px;
            animation: showering-squares 0.8s linear infinite;
        }

        .video-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f0f0f;
            margin: 0;
            line-height: 1.4;
            max-width: 400px;
        }

        /* --- Right Side: Video & Actions --- */
        .player-section {
            display: flex;
            align-items: flex-end;
            gap: 16px;
        }

        .video-frame {
            width: 330px;
            aspect-ratio: 9 / 16;
            background-color: #1a1a1a;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Avatar Parallax System --- */
        .avatar-parallax-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .parallax-layer {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: contain;
            transform-origin: center center;
        }
        
        @keyframes idle-neck {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(2px); }
        }

        @keyframes idle-head {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }

        @keyframes idle-hair {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg) translateX(3px); }
        }

        .layer-neck { z-index: 10; animation: idle-neck 4s ease-in-out infinite; }
        .layer-ears { z-index: 11; animation: idle-head 4s ease-in-out infinite; }
        .layer-head { z-index: 12; animation: idle-head 4s ease-in-out infinite; }
        .layer-hair { z-index: 13; animation: idle-hair 4s ease-in-out infinite; }

        .top-controls {
            position: absolute;
            top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; z-index: 5;
        }

        .control-group { display: flex; gap: 12px; }

        .overlay-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }

        .caption-overlay {
            position: absolute; top: 40%;
            text-align: center; color: white;
            font-size: 24px; font-weight: 900;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            z-index: 5;
            padding: 0 10px;
        }

        .caption-highlight { color: #ffd700; }

        .action-bar {
            display: flex; flex-direction: column;
            align-items: center; gap: 16px; padding-bottom: 10px; z-index: 10;
        }

        .action-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 6px; background: none; border: none;
            cursor: pointer; color: #0f0f0f; padding: 0;
        }

        .action-item .icon-circle {
            background-color: #ffffff;
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .action-item:hover .icon-circle {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
        }

        .action-item span { font-size: 13px; font-weight: 700; }

        .audio-track {
            width: 40px; height: 40px; border-radius: 8px;
            border: 2px solid #000; object-fit: cover; margin-top: 8px;
        }

        /* --- Simulator Control Panel --- */
        .control-panel {
            position: absolute;
            top: 40px; left: 40px;
            background: #ffffff;
            padding: 24px; border-radius: 16px;
            z-index: 20; display: flex; flex-direction: column;
            gap: 16px; width: 280px;
        }

        .control-panel h2 { margin: 0; font-size: 20px; color: #0f0f0f; font-weight: 900; }
        .control-group-ui { display: flex; flex-direction: column; gap: 6px; }
        .control-group-ui label { font-size: 12px; font-weight: 900; color: #000; text-transform: uppercase; }

        /* --- Intense Animation State --- */
        @keyframes intense-talking {
            0% { transform: translateY(0) rotate(0deg); }
            20% { transform: translateY(-7px) rotate(-5deg); }
            40% { transform: translateY(4px) rotate(6deg); }
            60% { transform: translateY(-5px) rotate(-4deg); }
            80% { transform: translateY(3px) rotate(3deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .is-talking .layer-head, .is-talking .layer-ears { animation: intense-talking 0.4s infinite !important; }
        .is-talking .layer-hair { animation: intense-talking 0.4s infinite 0.08s !important; }

        /* --- Custom Fake reCAPTCHA Verification Layer --- */
        #captcha-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .captcha-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 310px;
            box-sizing: border-box;
        }

        .captcha-checkbox-wrapper {
            position: relative;
            width: 28px; height: 28px;
        }

        .captcha-checkbox {
            width: 100%; height: 100%;
            border: 2px solid #c1c1c1;
            border-radius: 2px; background: #fff;
            cursor: pointer; display: flex;
            justify-content: center; align-items: center;
        }

        .captcha-checkbox:hover { border-color: #b2b2b2; }

        @keyframes captcha-spin { to { transform: rotate(360deg); } }
        .captcha-spinner {
            display: none; width: 20px; height: 20px;
            border: 2.5px solid #4a90e2; border-radius: 50%;
            border-top-color: transparent;
            animation: captcha-spin 0.8s linear infinite;
        }

        .captcha-check {
            display: none; color: #00aa00;
            font-size: 26px; font-weight: 900;
        }

        .captcha-text { font-size: 14px; color: #222; flex-grow: 1; font-weight: 500; }
        .captcha-logo { display: flex; flex-direction: column; align-items: center; }
        .captcha-logo img { width: 32px; height: 32px; }
        .captcha-logo span { font-size: 8px; color: #555; margin-top: 2px; }

        /* Fake Fullscreen Loader */
        .loading-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .game-loader {
            width: 60px; height: 60px;
            border: 6px solid #000; border-radius: 12px;
            background: #ffd700;
            animation: captcha-spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            box-shadow: 4px 4px 0 #000;
        }

        .loading-container span {
            font-size: 20px; font-weight: 900; color: #000;
            text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- Tiny Floating Pill Footer Overlay --- */
        .claymunza-footer {
            position: fixed;
            bottom: 16px; left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #000000;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 900;
            z-index: 99999;
            text-decoration: none;
            display: flex; gap: 4px;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s;
        }

        .claymunza-footer:hover {
            transform: translateX(-50%) translate(-2px, -2px);
            box-shadow: 12px 12px 0px #000000 !important;
        }

        .claymunza-footer a {
            color: #0556bf;
            text-decoration: underline;
        }

        /* --- Rotate Device Warning --- */
        #rotate-warning {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f0f0f; color: white; z-index: 99999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }

        #rotate-warning i { font-size: 64px; margin-bottom: 20px; animation: rotate-phone 2s infinite ease-in-out; }
        @keyframes rotate-phone { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } }

        /* --- Mobile Responsive UI --- */
        @media (max-width: 800px) {
            @media (orientation: portrait) {
                .shorts-container, .control-panel, .claymunza-footer { display: none !important; }
                #rotate-warning { display: flex !important; }
            }
            body { background-color: #000000; animation: none; }
            .shorts-container { height: 100dvh; padding: 0; justify-content: center; align-items: center; }
            .player-section { width: 100%; height: 100%; gap: 0; }
            .video-frame { width: 100%; height: 100%; border-radius: 0; border: none !important; box-shadow: none !important; }
            .metadata-section { position: absolute; bottom: 24px; left: 16px; width: calc(100% - 80px); }
            .handle, .video-title { color: #ffffff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
            .action-bar { position: absolute; bottom: 24px; right: 12px; }
            .action-item { color: #ffffff; }
            .action-item .icon-circle { background-color: rgba(255, 255, 255, 0.2); border-color: #fff; color: #fff; }
        }
    </style>
</head>
<body>

    <audio id="bgm-player" src="/bgm.mp3" loop></audio>

    <div id="captcha-overlay">
        <div class="captcha-card" id="captcha-card">
            <div class="captcha-checkbox-wrapper">
                <div class="captcha-checkbox" onclick="verifyFakeCaptcha(this)"></div>
                <div class="captcha-spinner"></div>
                <div class="captcha-check">✓</div>
            </div>
            <div class="captcha-text">I'm not a robot</div>
            <div class="captcha-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/ad/RecaptchaLogo.svg" alt="reCAPTCHA">
                <span>privacy • terms</span>
            </div>
        </div>

        <div class="loading-container" id="game-loader-screen">
            <div class="game-loader"></div>
            <span>Loading Simulator...</span>
        </div>
    </div>

    <div id="rotate-warning">
        <i class="material-icons">screen_rotation</i>
        <h2>Please rotate your device</h2>
        <p>Landscape mode is required for the CarterPCs Simulator experience.</p>
    </div>

    <div class="control-panel">
        <h2>CarterPCs Simulator</h2>
        
        <div class="control-group-ui">
            <label>Topic</label>
            <select id="sim-topic">
                <option value="Linux">Linux</option>
                <option value="Apple">Apple / Macs</option>

            </select>
        </div>

        <div class="control-group-ui">
            <label>Tone</label>
            <select id="sim-tone">
                <option value="Humorous">Humorous</option>
                <option value="Aggressive">Aggressive Rant</option>
                <option value="Educational">Educational</option>
                <option value="Sarcastic">Sarcastic</option>
            </select>
        </div>

        <div class="control-group-ui">
            <label>Subtopic</label>
            <select id="sim-subtopic">
                <option value="Switching">Switching over</option>
                <option value="Pricing">The Pricing</option>
                <option value="Fanboys">The Fanboys</option>
                <option value="Performance">Gaming Performance</option>
                <option value="Aesthetics">The Aesthetics</option>
            </select>
        </div>

        <div class="control-group-ui">
            <label>Stance</label>
            <select id="sim-stance">
                <option value="For">For / In Favor</option>
                <option value="Against">Against / Hating</option>
            </select>
        </div>

        <button class="generate-btn" onclick="startSimulation()">Generate Short!</button>
    </div>

    <div class="shorts-container">
        
        <div class="metadata-section">
            <div class="creator-info">
                <img src="https://ui-avatars.com/api/?name=C&background=random" alt="Avatar" class="avatar">
                <span class="handle">@actuallycarterpcs</span>
                <button class="subscribe-btn" onclick="toggleSubscribe(this)">Subscribe</button>
            </div>
            <h1 class="video-title" id="dynamic-title">Configure your video...</h1>
        </div>

        <div class="player-section">
            
            <div class="video-frame">
                <div class="avatar-parallax-container">
                    <img src="/neck.webp" class="parallax-layer layer-neck" alt="Neck">
                    <img src="/ears.webp" class="parallax-layer layer-ears" alt="Ears">
                    <img src="/head.webp" class="parallax-layer layer-head" alt="Head">
                    <img src="/hair.webp" class="parallax-layer layer-hair" alt="Hair">
                </div>

                <div class="top-controls">
                    <div class="control-group">
                        <button class="overlay-btn"><i class="material-icons">play_arrow</i></button>
                        <button class="overlay-btn"><i class="material-icons">volume_up</i></button>
                    </div>
                    <div class="control-group">
                        <button class="overlay-btn"><i class="material-icons">more_vert</i></button>
                        <button class="overlay-btn"><i class="material-icons">fullscreen</i></button>
                    </div>
                </div>

                <div class="caption-overlay" id="dynamic-captions"></div>
            </div>

            <div class="action-bar">
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">thumb_up</i></div>
                    <span>20k</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">thumb_down</i></div>
                    <span>Dislike</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">comment</i></div>
                    <span>1,160</span>
                </button>
                <button class="action-item">
                    <div class="icon-circle"><i class="material-icons">reply</i></div>
                    <span>Share</span>
                </button>

                    <div class="icon-circle"><i class="material-icons">sync</i></div>
                    <span>Remix</span>

    <div class="claymunza-footer">
        made by &nbsp;<a href="https://cza.vercel.app" target="_blank">claymunza</a>
    </div>
</body>
    <script>
        // Neubrutalist Subscribe Toggle Action
        function toggleSubscribe(btn) {
            if (btn.innerText === "Subscribe") {
                btn.innerText = "Subscribed";
                btn.style.backgroundColor = "#111111";
                btn.style.color = "#ffffff";
            } else {
                btn.innerText = "Subscribe";
                btn.style.backgroundColor = "#ffffff";
                btn.style.color = "#000000";
            }
        }

        // --- Fake reCAPTCHA Verification and Audio Engine Sequence ---
        function verifyFakeCaptcha(checkboxElement) {
            const card = document.getElementById('captcha-card');
            const loaderScreen = document.getElementById('game-loader-screen');
            const overlay = document.getElementById('captcha-overlay');
            const spinner = document.querySelector('.captcha-spinner');
            const checkmark = document.querySelector('.captcha-check');
            const bgm = document.getElementById('bgm-player');

            // 1. Hide the empty check square, show spinning loader
            checkboxElement.style.display = 'none';
            spinner.style.display = 'block';

            setTimeout(() => {
                // 2. Hide spinner, switch to green success checkmark
                spinner.style.display = 'none';
                checkmark.style.display = 'block';
                
                // Unblock and instantly initialize sound play tracking loop
                bgm.play().catch(err => console.log("Audio play blocked: ", err));

                setTimeout(() => {
                    // 3. Swap Captcha card out for stylized game screen spinner
                    card.style.display = 'none';
                    loaderScreen.style.display = 'flex';

                    setTimeout(() => {
                        // 4. Clear overlay entirely to reveal the app layout
                        overlay.style.opacity = '0';
                        setTimeout(() => {
                            overlay.style.display = 'none';
                        }, 400);
                    }, 1600); // 1.6 Seconds for loading simulation
                }, 600);
            }, 1000); // 1 Second validation check simulation
        }

        // --- Simulator Generator Logic ---
        let subtitleInterval = null;

        function startSimulation() {
            const topic = document.getElementById('sim-topic').value;
            const tone = document.getElementById('sim-tone').value;
            const subtopic = document.getElementById('sim-subtopic').value;
            const stance = document.getElementById('sim-stance').value;

            const { title, subtitles } = generateScript(topic, tone, subtopic, stance);
            document.getElementById('dynamic-title').innerText = title + " #carterpcs #tech";
            playVideo(subtitles);
        }

        function generateScript(topic, tone, subtopic, stance) {
            let title = `Why I ${stance === 'For' ? 'love' : 'refuse to buy'} ${topic}`;
            if (tone === 'Aggressive') title = title.toUpperCase() + " 😡";
            if (tone === 'Educational') title = `The truth about ${topic} ${subtopic}`;
            if (tone === 'Sarcastic') title = `Oh look, another video about ${topic}...`;

            let subs = [];
            subs.push(`Alright let's talk about <span class="caption-highlight">${topic}</span>.`);
            
            if (stance === 'For') {
                subs.push(`Everyone hates on <span class="caption-highlight">${subtopic}</span>...`);
                subs.push(`But honestly? It's <span class="caption-highlight">genius</span>.`);
            } else {
                subs.push(`When it comes to <span class="caption-highlight">${subtopic}</span>...`);
                subs.push(`It is an absolute <span class="caption-highlight">scam</span>.`);
            }

            if (tone === 'Humorous') {
                subs.push(`I'd rather use a <span class="caption-highlight">potato</span>.`);
                subs.push(`Bro, be so for real right now.`);
            } else if (tone === 'Aggressive') {
                subs.push(`WHAT ARE THEY <span class="caption-highlight">THINKING?!</span>`);
                subs.push(`Make it make sense!`);
            } else if (tone === 'Educational') {
                subs.push(`Let's look at the <span class="caption-highlight">benchmarks</span>.`);
                subs.push(`The data doesn't lie.`);
            } else if (tone === 'Sarcastic') {
                subs.push(`Wow, very <span class="caption-highlight">innovative</span>.`);
                subs.push(`Take all my money. Not.`);
            }

            subs.push(`Let me know what you think.`);
            subs.push(`Follow for more.`);
            subs.push(``); 

            return { title, subtitles: subs };
        }

        function playVideo(subtitles) {
            const captionBox = document.getElementById('dynamic-captions');
            const parallaxContainer = document.querySelector('.avatar-parallax-container');
            
            if (subtitleInterval) clearInterval(subtitleInterval);
            captionBox.innerHTML = "";
            parallaxContainer.classList.add('is-talking');

            let index = 0;
            subtitleInterval = setInterval(() => {
                if (index < subtitles.length) {
                    captionBox.innerHTML = subtitles[index];
                    index++;
                } else {
                    clearInterval(subtitleInterval);
                    parallaxContainer.classList.remove('is-talking');
                }
            }, 2000); 
        }
    </script>
</body>
</html>
